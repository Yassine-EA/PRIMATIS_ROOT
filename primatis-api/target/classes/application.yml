spring:
  application:
    name: primatis-api

  datasource:
    # Base de données locale utilisée pour le développement.
    url: jdbc:postgresql://localhost:5432/primatis_dev
    username: ${SPRING_DATASOURCE_USERNAME:primatis}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Limites techniques des requêtes multipart.
  # La validation métier des médias est appliquée par le service dédié.
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

# Documentation OpenAPI disponible dans les environnements de développement.
springdoc:
  api-docs:
    version: openapi_3_0
    enabled: true
  swagger-ui:
    enabled: true

primatis:
  security:
    jwt:
      issuer: ${PRIMATIS_JWT_ISSUER:primatis-api}
      audience: ${PRIMATIS_JWT_AUDIENCE:primatis-api}
      access-token-ttl: PT1H
      private-key-location: ${PRIMATIS_JWT_PRIVATE_KEY_PATH}
      public-key-location: ${PRIMATIS_JWT_PUBLIC_KEY_PATH}

    # Origines autorisées pour l'application web.
    cors:
      allowed-origins: ${PRIMATIS_CORS_ALLOWED_ORIGINS:http://localhost:4200}

  article-media:
    # Dossier de stockage des médias associés aux articles.
    storage-path: ${PRIMATIS_ARTICLE_MEDIA_STORAGE_PATH:./public/media/articles}